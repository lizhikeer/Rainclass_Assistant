<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>雨课堂 - 习题作答</title>
</head>
<body>
    <div class="slide__cmp">
        <div class="time-box">
            <div class="timing timing--number">倒计时 05:00</div>
        </div>
        <div class="quiz-content">
            <p class="quiz-stem">1. 下列协议中运行在网络层的是？</p>
            <div class="quiz-options">
                <p data-option="A" class="option-item">A. IP</p>
                <p data-option="B" class="option-item">B. TCP</p>
                <p data-option="C" class="option-item">C. UDP</p>
                <p data-option="D" class="option-item">D. HTTP</p>
            </div>
            <div class="quiz-action">
                <button class="btn btn-submit can" title="提交答案">提交答案</button>
            </div>
        </div>
    </div>
</body>
</html>
